<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up - CodeQuest</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #09001f, #16004d, #001f3f);
            color: white;
        }

        .signup-box {
            width: 420px;
            padding: 40px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
        }

        .logo {
            text-align: center;
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .logo span {
            color: #00e5ff;
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 10px;
            outline: none;
            font-size: 15px;
        }

        .signup-btn {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            border: none;
            border-radius: 25px;
            background: #00e5ff;
            color: #001018;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
            color: #ccc;
        }

        .login-link a {
            color: #00e5ff;
            text-decoration: none;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: white;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="signup-box">

        <div class="logo">
            ⚡ Code<span>Quest</span>
        </div>

        <h2>Create Your Account</h2>

        <form method="POST" action="/signup">

            <label>Username</label>
            <input
                type="text"
                name="username"
                placeholder="Enter username"
                required
            >

            <label>Email</label>
            <input
                type="email"
                name="email"
                placeholder="Enter email"
                required
            >

            <label>Password</label>
            <input
                type="password"
                name="password"
                placeholder="Create password"
                required
            >

            <label>Confirm Password</label>
            <input
                type="password"
                name="confirm_password"
                placeholder="Confirm password"
                required
            >

            <button class="signup-btn" type="submit">
                🚀 CREATE ACCOUNT
            </button>

        </form>

        <div class="login-link">
            Already have an account?
            <a href="/login">Login</a>
        </div>

        <a class="back" href="/">
            ← Back to CodeQuest
        </a>

    </div>

</body>

</html>
